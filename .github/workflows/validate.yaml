name: Validate Helm chart
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm dependency update
      - run: helm lint .
      - run: helm template homelab . --namespace homelab > rendered.yaml
