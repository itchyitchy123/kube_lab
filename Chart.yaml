apiVersion: v2
name: kubernetes-homelab
description: Reproducible Kubernetes platform with Helm, StatefulSets, HPA, ingress, Prometheus, Grafana and Loki
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  - name: kube-prometheus-stack
    alias: monitoring
    version: "~65.0.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: monitoring.enabled
  - name: loki
    version: "~6.0.0"
    repository: https://grafana.github.io/helm-charts
    condition: loki.enabled
  - name: promtail
    version: "~6.16.0"
    repository: https://grafana.github.io/helm-charts
    condition: promtail.enabled
