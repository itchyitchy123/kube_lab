apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "homelab.fullname" . }}-wordpress
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.wordpress.persistence.size }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homelab.fullname" . }}-wordpress
spec:
  replicas: {{ .Values.wordpress.replicaCount }}
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: wordpress, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: wordpress, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      initContainers:
        - name: wait-for-database
          image: busybox:1.36
          command: [sh, -c, 'until nc -z {{ include "homelab.fullname" . }}-mariadb 3306; do sleep 2; done']
      containers:
        - name: wordpress
          image: {{ .Values.wordpress.image | quote }}
          ports: [{ name: http, containerPort: 80 }]
          env:
            - { name: WORDPRESS_DB_HOST, value: {{ include "homelab.fullname" . }}-mariadb:3306 }
            - { name: WORDPRESS_DB_NAME, value: {{ .Values.mariadb.database | quote }} }
            - { name: WORDPRESS_DB_USER, value: {{ .Values.mariadb.user | quote }} }
            - name: WORDPRESS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "homelab.fullname" . }}-credentials, key: mariadb-password } }
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
          readinessProbe: { httpGet: { path: /wp-login.php, port: http }, initialDelaySeconds: 15, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /wp-login.php, port: http }, initialDelaySeconds: 60, periodSeconds: 20 }
          volumeMounts: [{ name: data, mountPath: /var/www/html }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: {{ include "homelab.fullname" . }}-wordpress } }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "homelab.fullname" . }}-wordpress
spec:
  selector: { app.kubernetes.io/name: wordpress, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: http, port: 80, targetPort: http }]
---
{{- if .Values.wordpress.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "homelab.fullname" . }}-wordpress
spec:
  ingressClassName: {{ .Values.wordpress.ingress.className }}
  rules:
    - host: {{ .Values.wordpress.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ include "homelab.fullname" . }}-wordpress, port: { name: http } }
{{- end }}
---
{{- if .Values.wordpress.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "homelab.fullname" . }}-wordpress
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "homelab.fullname" . }}-wordpress }
  minReplicas: {{ .Values.wordpress.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.wordpress.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.wordpress.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
