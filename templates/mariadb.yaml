apiVersion: v1
kind: Service
metadata:
  name: {{ include "homelab.fullname" . }}-mariadb
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: mariadb, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: mysql, port: 3306 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "homelab.fullname" . }}-mariadb
spec:
  serviceName: {{ include "homelab.fullname" . }}-mariadb
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mariadb, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mariadb, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      securityContext: { fsGroup: 999 }
      containers:
        - name: mariadb
          image: {{ .Values.mariadb.image | quote }}
          ports: [{ name: mysql, containerPort: 3306 }]
          env:
            - { name: MARIADB_DATABASE, value: {{ .Values.mariadb.database | quote }} }
            - { name: MARIADB_USER, value: {{ .Values.mariadb.user | quote }} }
            - name: MARIADB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "homelab.fullname" . }}-credentials, key: mariadb-password } }
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "homelab.fullname" . }}-credentials, key: mariadb-root-password } }
          resources:
            {{- toYaml .Values.mariadb.resources | nindent 12 }}
          readinessProbe: { exec: { command: [healthcheck.sh, --connect, --innodb_initialized] }, initialDelaySeconds: 15, periodSeconds: 10 }
          livenessProbe: { exec: { command: [healthcheck.sh, --connect, --innodb_initialized] }, initialDelaySeconds: 30, periodSeconds: 20 }
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.mariadb.persistence.size }} } }
