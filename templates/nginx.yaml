apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "homelab.fullname" . }}-nginx
data:
  index.html: |
    <!doctype html><html><head><title>Kubernetes Home Lab</title></head>
    <body><h1>Kubernetes Home Lab</h1><p>NGINX is running on Kubernetes.</p></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homelab.fullname" . }}-nginx
  labels: { app.kubernetes.io/name: nginx, app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  replicas: {{ .Values.nginx.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/name: nginx, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nginx, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 101, fsGroup: 101 }
      containers:
        - name: nginx
          image: {{ .Values.nginx.image | quote }}
          ports: [{ name: http, containerPort: 80 }]
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: content, mountPath: /usr/share/nginx/html }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
      volumes:
        - { name: content, configMap: { name: {{ include "homelab.fullname" . }}-nginx } }
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "homelab.fullname" . }}-nginx
spec:
  selector: { app.kubernetes.io/name: nginx, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: http, port: {{ .Values.nginx.service.port }}, targetPort: http }]
---
{{- if .Values.nginx.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "homelab.fullname" . }}-nginx
spec:
  ingressClassName: {{ .Values.nginx.ingress.className }}
  rules:
    - host: {{ .Values.nginx.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ include "homelab.fullname" . }}-nginx, port: { name: http } }
{{- end }}
---
{{- if .Values.nginx.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "homelab.fullname" . }}-nginx
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "homelab.fullname" . }}-nginx }
  minReplicas: {{ .Values.nginx.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.nginx.autoscaling.maxReplicas }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.nginx.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
