apiVersion: v1
kind: Service
metadata:
  name: {{ include "homelab.fullname" . }}-redis
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: redis, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: redis, port: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "homelab.fullname" . }}-redis
spec:
  serviceName: {{ include "homelab.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999 }
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"']
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "homelab.fullname" . }}-credentials, key: redis-password } }
          ports: [{ name: redis, containerPort: 6379 }]
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          readinessProbe: { exec: { command: [sh, -c, 'redis-cli -a "$REDIS_PASSWORD" ping'] }, initialDelaySeconds: 5, periodSeconds: 10 }
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.redis.persistence.size }} } }
